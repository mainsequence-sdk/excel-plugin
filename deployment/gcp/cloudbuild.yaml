steps:
  # 1. Install dependencies at repo root
  - id: "npm ci"
    name: "gcr.io/cloud-builders/npm"
    args: ["ci"]

  # 2. Build the add-in (Webpack -> dist/)
  - id: "build add-in"
    name: "gcr.io/cloud-builders/npm"
    args: ["run", "build"]
  # 3. Upload built web assets (everything under dist/) to env-specific bucket
  - id: "upload web assets"
    name: "gcr.io/cloud-builders/gsutil"
    dir: "dist"
    args:
      [
        "-m",
        "rsync",
        "-r",
        # "-c", # uncomment to enable checksum comparison
        "-d",
        ".",
        "gs://tsorm-production/excel-addin"
      ]

  # 4. Pick the right manifest based on environment and upload it
  - id: "upload manifest"
    name: "gcr.io/cloud-builders/gcloud"
    dir: "."
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        echo "Using manifest.xml"
        gsutil cp dist/manifest.xml "gs://tsorm-production/excel-addin/manifest.xml"
options:
  logging: CLOUD_LOGGING_ONLY
