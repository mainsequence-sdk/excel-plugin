steps:
  # 1. Install dependencies in excel-addin/
  - id: "npm ci"
    name: "gcr.io/cloud-builders/npm"
    dir: "excel-addin"
    args: ["ci"]

  # 2. Build the add-in (Webpack -> dist/)
  - id: "build add-in"
    name: "gcr.io/cloud-builders/npm"
    dir: "excel-addin"
    args: ["run", "build"]
    env:
      # optional; only if you actually read process.env.APP_ENV in your build
      - "APP_ENV=${_ENVIRONMENT}"

  # 3. Upload the built web assets (dist/) to env-specific bucket
  - id: "upload web assets"
    name: "gcr.io/cloud-builders/gsutil"
    dir: "excel-addin"
    args:
      [
        "-m",
        "rsync",
        "-r",
        "-c",
        "-d",
        "dist",
        "gs://mainsequence-excel-addin-${_ENVIRONMENT}/web"
      ]

  # 4. Pick the right manifest based on environment and upload it
  - id: "upload manifest"
    name: "gcr.io/cloud-builders/gcloud"
    dir: "excel-addin"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        if [ "${_ENVIRONMENT}" = "development" ]; then
          gsutil cp manifest.dev.xml "gs://mainsequence-excel-addin-${_ENVIRONMENT}/manifest.xml"
        else
          gsutil cp manifest.xml "gs://mainsequence-excel-addin-${_ENVIRONMENT}/manifest.xml"
        fi

substitutions:
  _ENVIRONMENT: $_TF_ENVIRONMENT

options:
  logging: CLOUD_LOGGING_ONLY
