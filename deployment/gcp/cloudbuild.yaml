steps:
  # 1. Install dependencies in repo root
  - id: "npm ci"
    name: "gcr.io/cloud-builders/npm"
    args: ["ci"]

  # 2. Build the add-in (Webpack -> dist/)
  - id: "build add-in"
    name: "gcr.io/cloud-builders/npm"
    args: ["run", "build"]
    env:
      # optional; only if you use process.env.APP_ENV in your build
      - "APP_ENV=${_ENVIRONMENT}"

  # 3. Upload the built web assets (everything under dist/) to env-specific bucket
  - id: "upload web assets"
    name: "gcr.io/cloud-builders/gsutil"
    dir: "dist"   # <--- dist is at repo-root/dist
    args:
      [
        "-m",
        "rsync",
        "-r",
        "-c",
        "-d",
        ".",
        "gs://mainsequence-excel-addin-${_ENVIRONMENT}/web"
      ]

  # 4. Pick the right manifest based on environment and upload it
  - id: "upload manifest"
    name: "gcr.io/cloud-builders/gcloud"
    dir: "."      # <--- manifests live at repo root
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        if [ "${_ENVIRONMENT}" = "development" ]; then
          SRC="manifest.dev.xml"
        else
          SRC="manifest.xml"
        fi
        echo "Using manifest: $SRC (pwd: $(pwd))"
        ls -l "$SRC"
        gsutil cp "$SRC" "gs://mainsequence-excel-addin-${_ENVIRONMENT}/manifest.xml"

substitutions:
  _ENVIRONMENT: $_TF_ENVIRONMENT

options:
  logging: CLOUD_LOGGING_ONLY
