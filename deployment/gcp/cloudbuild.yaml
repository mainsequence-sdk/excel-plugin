steps:
  # 1. Install dependencies in excel-addin/
  - id: "npm ci"
    name: "gcr.io/cloud-builders/npm"
    dir: "excel-addin"
    args: ["ci"]

  # 2. Build the add-in (Webpack -> dist/)
  - id: "build add-in"
    name: "gcr.io/cloud-builders/npm"
    dir: "excel-addin"
    args: ["run", "build"]
    env:
      # optional; only if you actually use process.env.APP_ENV
      - "APP_ENV=${_ENVIRONMENT}"

  # 3. Upload the built web assets (dist/) to env-specific bucket
  - id: "upload web assets"
    name: "gcr.io/cloud-builders/gsutil"
    dir: "excel-addin"
    args:
      [
        "-m",
        "rsync",
        "-r",
        "-c",
        "-d",
        "dist",
        "gs://mainsequence-excel-addin-${_ENVIRONMENT}/web"
      ]

  # 4. Pick the right manifest based on environment and upload it
  - id: "upload manifest"
    name: "gcr.io/cloud-builders/gcloud"
    dir: "excel-addin"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        if [ "${_ENVIRONMENT}" = "development" ]; then
          MANIFEST=manifest.dev.xml
        else
          MANIFEST=manifest.xml
        fi
        # NOTE: $$MANIFEST so Cloud Build doesn't treat ${MANIFEST} as a substitution
        gsutil cp "$$MANIFEST" "gs://mainsequence-excel-addin-${_ENVIRONMENT}/manifest.xml"

substitutions:
  _ENVIRONMENT: $_TF_ENVIRONMENT

options:
  logging: CLOUD_LOGGING_ONLY
